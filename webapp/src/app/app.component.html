<div class="container">
  <div class="columns">
    <div class="column is-12">
      <section class="hero is-info welcome is-small">
        <div class="hero-body">
          <div class="container hero-content">
            <div>
              <h1 class="title">iEmu - IoT Device Emulator</h1>
              <h2 class="subtitle">Management UI for iEmu - IoT Device Emulator</h2>
            </div>
            <button
              type="button"
              class="button is-rounded theme-toggle"
              (click)="toggleTheme()"
              [attr.aria-label]="
                theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
              "
              [title]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
            >
              {{ theme() === 'dark' ? '☾' : '☀' }}
            </button>
          </div>
        </div>
      </section>
    </div>
  </div>
  <div class="columns is-multiline">
    @if (isStateReady()) {
      <div
        class="column is-12-mobile is-10-desktop is-offset-1-desktop is-8-widescreen is-offset-2-widescreen"
      >
        <app-state-display
          [state]="state()!"
          [firmware]="firmware() ?? undefined"
          [connection]="connection()!"
          (onOffToggle)="onOffToggle()"
          (dimmerSave)="onDimmerChanged($event)"
          (onTimeReset)="onOnTimeReset()"
          (connect)="onConnect()"
          (disconnect)="onDisconnect()"
        ></app-state-display>
      </div>
    }
  </div>
</div>
