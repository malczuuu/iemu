<app-connection-card
  [connection]="connection"
  (connect)="connect.emit()"
  (disconnect)="disconnect.emit()"
></app-connection-card>

<app-time-settings-card [state]="state"></app-time-settings-card>

<app-light-control-card
  [state]="state"
  (onOffToggle)="onOffToggle.emit($event)"
  (dimmerSave)="dimmerSave.emit($event)"
  (onTimeReset)="onTimeReset.emit($event)"
></app-light-control-card>

@if (firmware) {
  <app-firmware-update-card [firmware]="firmware"></app-firmware-update-card>
}
